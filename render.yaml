services:
  - type: web
    name: borwell-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    disks:
      - name: borwell-data
        mountPath: /opt/render/project/src/server
        sizeGB: 1
# Data is persisted on disk + gitignored (never lost on git push). Free plan disk requires Starter plan ($7/mo) - alternatively set GOOGLE_SERVICE_ACCOUNT_KEY + GOOGLE_DRIVE_FOLDER_ID for free Drive backup/restore on every deploy.
